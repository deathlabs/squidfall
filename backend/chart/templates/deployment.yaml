# backend/chart/templates/deployment.yaml

---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ .Values.service.name }}
  labels:
    app.kubernetes.io/app: {{ .Values.app }}
    app.kubernetes.io/component: {{ .Values.service.name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/app: {{ .Values.app }}
      app.kubernetes.io/component: {{ .Values.service.name }}
  replicas: {{ .Values.replicaCount }}
  template:
    metadata:
      labels:
        app.kubernetes.io/app: {{ .Values.app }}
        app.kubernetes.io/component: {{ .Values.service.name }}
    spec:
      containers:
        - name: {{ .Values.service.name }}
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          envFrom:
            - secretRef:
                name: {{ .Values.service.name }}
          readinessProbe:
            httpGet:
              path: /api/v1/health/
              port: {{ .Values.service.port }}
              httpHeaders:
                - name: Host
                  value: backend
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/v1/health/
              port: {{ .Values.service.port }}
              httpHeaders:
                - name: Host
                  value: backend
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
