# zarf.yaml

---
kind: ZarfPackageConfig
metadata:
  name: squidfall
  version: 0.1.0
  annotations:
    dev.uds.title: squidfall

components:
  - name: database
    required: true
    charts:
      - name: database
        version: 0.1.0
        namespace: squidfall
        localPath: database/chart
        valuesFiles:
          - database/chart/values.yaml
    images:
      - squidfall/database:latest
  - name: backend
    required: true
    charts:
      - name: backend
        version: 0.1.0
        namespace: squidfall
        localPath: backend/chart
        valuesFiles:
          - backend/chart/values.yaml
    images:
      - squidfall/backend:latest
  - name: tools
    required: true
    charts:
      - name: tools
        version: 0.1.0
        namespace: squidfall
        localPath: tools/chart
        valuesFiles:
          - tools/chart/values.yaml
    images:
      - squidfall/tools:latest
  - name: inference
    required: true
    charts:
      - name: inference
        version: 0.1.0
        namespace: squidfall
        localPath: inference/chart
        valuesFiles:
          - inference/chart/values.yaml
    images:
      - squidfall/inference:latest
  - name: frontend
    required: true
    charts:
      - name: frontend
        version: 0.1.0
        namespace: squidfall
        localPath: frontend/chart
        valuesFiles:
          - frontend/chart/values.yaml
    images:
      - squidfall/frontend:latest
  - name: uds-package
    required: true
    manifests:
      - name: squidfall
        namespace: squidfall
        files:
          - uds-package.yaml
