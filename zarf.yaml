# zarf.yaml

---
kind: ZarfPackageConfig
metadata:
  name: squidfall
  version: 0.1.0
  annotations:
    dev.uds.title: squidfall

components:
  - name: database
    required: true
    charts:
      - name: database
        version: 0.1.0
        namespace: squidfall
        localPath: database
        valuesFiles:
          - database/values.yaml
    images:
      - squidfall/database:latest
  - name: backend
    required: true
    charts:
      - name: backend
        version: 0.1.0
        namespace: squidfall
        localPath: backend
        valuesFiles:
          - backend/values.yaml
    images:
      - squidfall/backend:latest
  - name: uds
    required: true
    manifests:
      - name: squidfall
        namespace: squidfall
        files:
          - uds-package.yaml
